apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ai-sre-lab
data:
  prometheus.yml: "global:\n  scrape_interval: 5s\nscrape_configs:\n  - job_name:\
    \ demo\n    static_configs:\n      - targets: [\"orders:8080\", \"inventory:8080\"\
    ]\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ai-sre-lab
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      automountServiceAccountToken: false
      containers:
      - name: prometheus
        image: prom/prometheus:v3.5.0
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=2h
        - --storage.tsdb.retention.size=128MB
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
        - name: data
          mountPath: /prometheus
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        emptyDir:
          sizeLimit: 256Mi
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ai-sre-lab
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
