apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-remediator
  namespace: ai-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-remediation-role
  namespace: ai-sre-lab
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [orders]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-remediation-binding
  namespace: ai-sre-lab
subjects:
  - kind: ServiceAccount
    name: incident-remediator
    namespace: ai-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: incident-remediation-role
