apiVersion: v1
kind: Namespace
metadata:
  name: ai-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-agent
  namespace: ai-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-diagnostics-role
  namespace: ai-sre-lab
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - events
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-agent-binding
  namespace: ai-sre-lab
subjects:
- kind: ServiceAccount
  name: incident-agent
  namespace: ai-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-diagnostics-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-configuration-reader
  namespace: ai-sre-lab
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - orders
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - services
  resourceNames:
  - inventory
  verbs:
  - get
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-configuration-reader
  namespace: ai-sre-lab
subjects:
- kind: ServiceAccount
  name: incident-agent
  namespace: ai-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: incident-configuration-reader
