apiVersion: v1
kind: Namespace
metadata:
  name: ai-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-agent
  namespace: ai-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-diagnostics-role
  namespace: ai-sre-lab
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - events
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-agent-binding
  namespace: ai-sre-lab
subjects:
- kind: ServiceAccount
  name: incident-agent
  namespace: ai-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-diagnostics-role
